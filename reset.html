<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Colorado 14ers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffffff'/%3E%3Cpolygon points='4,26 12,12 16,18 22,8 28,26' fill='none' stroke='%23011f5b' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='22' cy='8' r='2' fill='%23a8443a'/%3E%3C/svg%3E">
<style>
@font-face {
  font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400; font-display: swap;
  src: url("fonts/ibm-plex-mono-400-latin.woff2") format("woff2");
}
@font-face {
  font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; font-display: swap;
  src: url("fonts/ibm-plex-mono-500-latin.woff2") format("woff2");
}
:root {
  --bg: #ffffff; --bg-tint: #f7f7f4;
  --text: #111113; --text-heading: #303130; --text-dim: #616160; --text-faint: #717270;
  --border: #e4e4df; --border-strong: #91928f;
  --navy: #011f5b; --navy-deep: #001541; --navy-soft: #dbe3f5;
  --rust: #a8443a; --good: #1d6f3f;
  --font-sans: Verdana, Geneva, "DejaVu Sans", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 15px; line-height: 1.65; }
a { color: var(--navy); text-decoration: none; border-bottom: 1px solid var(--navy-soft); }
a:hover { color: var(--navy-deep); border-bottom-color: var(--navy-deep); }

nav.topnav {
  position: sticky; top: 0; z-index: 10;
  background: #ffffffe0;
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--border);
}
nav.topnav .wrap { max-width: 600px; margin: 0 auto; padding: .9rem 1.5rem; display: flex; justify-content: space-between; align-items: baseline; gap: 1.5rem; }
nav.topnav .brand { color: var(--text-heading); font-weight: 500; font-size: .9rem; border: 0; font-family: var(--font-mono); letter-spacing: -.01em; }
nav.topnav .brand:after { content: ""; display: inline-block; width: 2px; height: .95em; background: var(--navy); margin-left: 3px; vertical-align: -.1em; animation: brand-caret-blink 1.06s step-end infinite; }
@keyframes brand-caret-blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { nav.topnav .brand:after { animation: none; opacity: 1; } }

.page { max-width: 600px; margin: 0 auto; padding: 4rem 1.5rem; }
.overline { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-dim); display: block; margin-bottom: 1.25rem; }
h1 { font-size: clamp(2rem, 4.5vw, 2.6rem); letter-spacing: -.01em; margin: 0 0 1rem; color: var(--text-heading); }
.accent { color: var(--rust); }
.lede { color: var(--text); margin: 0 0 2rem; }

.card {
  border: 1px solid var(--border); border-left: 3px solid var(--navy);
  background: var(--bg); padding: 1.25rem 1.5rem;
}
label { display: block; font-family: var(--font-mono); font-size: .7rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); margin: .8rem 0 .3rem; }
input { width: 100%; font-family: var(--font-mono); font-size: .95rem; padding: .6rem .75rem; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 0; color: var(--text-heading); }
input:focus { outline: none; border-color: var(--navy); box-shadow: inset 0 -2px 0 0 var(--navy); }
button.primary { margin-top: 1.1rem; font-family: var(--font-mono); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; padding: .6rem 1.1rem; background: var(--navy); color: #fff; border: 1px solid var(--navy); border-radius: 0; cursor: pointer; }
button.primary:hover:not(:disabled) { background: var(--navy-deep); border-color: var(--navy-deep); }
button.primary:disabled { background: var(--bg-tint); border-color: var(--border); color: var(--text-faint); cursor: not-allowed; }
.err { color: var(--rust); font-family: var(--font-mono); font-size: .8rem; margin-top: .65rem; min-height: 1em; }
.ok  { color: var(--good); font-family: var(--font-mono); font-size: .8rem; margin-top: .65rem; }
.muted { color: var(--text-dim); font-family: var(--font-mono); font-size: .8rem; letter-spacing: .03em; }
</style>
</head>
<body>

<nav class="topnav">
  <div class="wrap">
    <a class="brand" href="./">14ers</a>
    <ul style="list-style:none; display:flex; gap:1.25rem; padding:0; margin:0;">
      <li><a href="./" style="border:0; font-family: var(--font-mono); font-size: .78rem; color: var(--text-dim); letter-spacing: .04em;">back</a></li>
    </ul>
  </div>
</nav>

<main class="page">
  <span class="overline">Account · Password recovery</span>
  <h1>Reset password<span class="accent">.</span></h1>
  <p class="lede">Set a new password for your Colorado 14ers account.</p>

  <div class="card" id="card">
    <p class="muted" id="status">verifying recovery link…</p>
  </div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://ifuhruklphwmwqattwvk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmdWhydWtscGh3bXdxYXR0d3ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1Njg0OTksImV4cCI6MjA5MzE0NDQ5OX0.OEea65dtlZRJvZrDpmqaRtQg7tMwMw1OS2yF4i4YRlc";

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    storageKey: "co14ers.auth",
    lock: async (_name, _acquireTimeout, fn) => fn()
  }
});

const card = document.getElementById("card");

function showForm() {
  card.innerHTML = `
    <form id="resetForm" autocomplete="on">
      <label for="pw1">new password</label>
      <input type="password" id="pw1" name="new-password" autocomplete="new-password" required>
      <label for="pw2">confirm password</label>
      <input type="password" id="pw2" name="confirm-password" autocomplete="new-password" required>
      <button type="submit" class="primary" id="go">save new password</button>
      <p class="err" id="err"></p>
    </form>
  `;
  document.getElementById("resetForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const pw1 = document.getElementById("pw1").value;
    const pw2 = document.getElementById("pw2").value;
    const err = document.getElementById("err");
    err.textContent = "";
    if (pw1.length < 8) { err.textContent = "Password must be at least 8 characters."; return; }
    if (pw1 !== pw2)    { err.textContent = "Passwords don't match."; return; }
    const btn = document.getElementById("go"); btn.disabled = true;
    const { error } = await sb.auth.updateUser({ password: pw1 });
    if (error) { err.textContent = error.message; btn.disabled = false; return; }
    card.innerHTML = `<p class="ok">Password updated. Redirecting…</p>`;
    setTimeout(() => { window.location.href = "./"; }, 1500);
  });
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" || (session && session.user)) showForm();
});

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user) {
    showForm();
  } else {
    setTimeout(async () => {
      const { data: { session: s2 } } = await sb.auth.getSession();
      if (s2 && s2.user) showForm();
      else card.innerHTML = `<p class="err">Recovery link is missing or expired. Request a new one from the <a href="./">main page</a>.</p>`;
    }, 1200);
  }
})();
</script>
</body>
</html>
